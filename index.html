<!DOCTYPE html>
<html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIVA · SOFTONE — Συμφωνία Ποσών</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mut:#6b7280;--line:#e3e6ec;--acc:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px}
h1{margin:0;font-size:20px}
header p,footer p{margin:4px 0 0;color:var(--mut);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:14px;margin:0 0 8px;letter-spacing:.3px}
textarea{width:100%;height:220px;font:15px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button{font:600 13px system-ui;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.5;cursor:wait}
select{padding:9px;border-radius:8px;border:1px solid var(--line)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:#e5e7eb;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.st{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.st b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.st span{font-size:12px;color:var(--mut)}
.warn{background:#fffbeb;border:1px solid #fcd34d;color:var(--warn);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.sec{margin-top:16px}
.sec h3{font-size:14px;margin:0 0 8px;padding:8px 12px;background:#eef2ff;border-radius:8px}
.sub{font-weight:600;margin:10px 0 4px;color:var(--mut);font-size:13px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.op{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6}
.det{display:none;color:var(--mut);font-size:12px}
.showdet .det{display:inline}
.showdet .detb{display:block}
.detb{display:none;color:var(--mut);font-size:12px;margin-top:4px}
</style></head>
<body>
<header><h1>VIVA · SOFTONE — Αυτόματη συμφωνία ποσών</h1><p>Όλοι οι υπολογισμοί γίνονται τοπικά στον browser. Δεν αποστέλλονται δεδομένα πουθενά.</p></header>
<main>
<div class="grid">
 <div class="card"><h2>ΣΤΗΛΗ VIVA <span id="cv" class="tag">0</span></h2><textarea id="viva" placeholder="Ένα ποσό ανά γραμμή, π.χ.&#10;22&#10;9,59&#10;-30"></textarea></div>
 <div class="card"><h2>ΣΤΗΛΗ SOFTONE <span id="cs" class="tag">0</span></h2><textarea id="soft" placeholder="Ένα ποσό ανά γραμμή, π.χ.&#10;26,98&#10;18,48&#10;-66,86"></textarea></div>
</div>
<div class="bar">
 <button class="p" id="go">ΕΝΑΡΞΗ ΕΛΕΓΧΟΥ</button>
 <button id="clr">ΚΑΘΑΡΙΣΜΟΣ</button>
 <button id="rep">ΕΠΑΝΑΦΟΡΑ</button>
 <label>Μέγιστο πλήθος ποσών ανά συνδυασμό <select id="mk"></select></label>
 <button id="exp">ΕΞΑΓΩΓΗ ΑΠΟΤΕΛΕΣΜΑΤΩΝ</button>
 <button id="det">ΕΜΦΑΝΙΣΗ ΑΝΑΛΥΤΙΚΩΝ ΠΡΑΞΕΩΝ</button>
</div>
<div class="prog"><i id="pb"></i></div>
<div id="msg" class="warn" style="display:none"></div>
<div id="out"></div>
</main>
<footer style="max-width:1200px;margin:0 auto;padding:0 16px 24px"><p id="tst"></p></footer>

<script>
// ENGINE-START
function parseAmount(raw){
  let s=String(raw).replace(/[\s\u00A0€]/g,'').replace(/\u2212/g,'-');
  let neg=false;
  const par=s.match(/^\((.*)\)$/); if(par){neg=true;s=par[1];}
  if(s[0]==='-'||s[0]==='+'){ if(s[0]==='-') neg=!neg; s=s.slice(1); }
  if(!/^\d[\d.,]*$/.test(s)) return {ok:false,msg:'μη έγκυρη τιμή'};
  const TH=/^\d{1,3}([.,]\d{3})+$/;
  const dec=Math.max(s.lastIndexOf('.'),s.lastIndexOf(','));
  let ip, fp='';
  if(dec>=0 && /^\d{1,2}$/.test(s.slice(dec+1))){
    ip=s.slice(0,dec); fp=s.slice(dec+1);
    if(/[.,]/.test(ip) && (!TH.test(ip) || new Set(ip.replace(/\d/g,'')).size>1)) return {ok:false,msg:'μη έγκυρος διαχωρισμός χιλιάδων'};
  } else if(/^\d+$/.test(s)) ip=s;
  else if(TH.test(s) && (s.match(/[.,]/g)||[]).length>=2 && new Set(s.replace(/\d/g,'')).size===1) ip=s;
  else return {ok:false,msg:'ασαφής μορφή αριθμού (γράψτε π.χ. 1234 ή 1234,00)'};
  ip=ip.replace(/[.,]/g,'');
  const c=parseInt(ip,10)*100+parseInt((fp+'00').slice(0,2),10);
  return {ok:true,c:neg?-c:c};
}
function fmt(c){
  const a=Math.abs(c), i=Math.floor(a/100), f=String(a%100).padStart(2,'0');
  return (c<0?'-':'')+String(i).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+f;
}
// Self-contained (runs in a Web Worker). Amounts are integer cents: no float errors.
function solveCore(P,prog){
  const MAXALT=5;
  const vivaAll=P.viva, softAll=P.soft, maxK=P.maxK, per=P.budget, total=P.total;
  const usedV=new Set(), usedS=new Set(), identical=[], bucket=new Map(), matches=[];
  let left=total, exhausted=0;
  // Step 3: identical amounts, one-to-one, original order
  for(const s of softAll){ if(!bucket.has(s.c)) bucket.set(s.c,[]); bucket.get(s.c).push(s); }
  for(const v of vivaAll){
    const b=bucket.get(v.c);
    if(b&&b.length){ const s=b.shift(); usedV.add(v.id); usedS.add(s.id); identical.push({v,s}); }
  }
  // Pool: remaining SOFTONE, zeros excluded, sorted ascending for pruning
  let avail=softAll.filter(s=>!usedS.has(s.id)&&s.c!==0).sort((a,b)=>a.c-b.c||a.line-b.line);
  const targets=vivaAll.filter(v=>!usedV.has(v.id));
  const steps=Math.max(1,(maxK-1)*targets.length); let done=0;

  // Find up to MAXALT exact subsets of exactly k signed items summing to target
  function search(arr,target,k){
    const n=arr.length, pre=[0];
    for(let i=0;i<n;i++) pre.push(pre[i]+arr[i].c);
    const sols=[], path=[], lim=Math.max(0,Math.min(per,left));
    let nodes=0, over=false;
    const dfs=(i,r,need)=>{
      if(++nodes>lim){over=true;return;}
      if(r===0){ if(need===0) sols.push(path.slice()); return; }
      if(i+r>n) return;
      if(need<pre[i+r]-pre[i]||need>pre[n]-pre[n-r]) return;
      for(let j=i;j<=n-r;j++){
        if(need<arr[j].c+pre[j+r]-pre[j+1]) break;
        path.push(j); dfs(j+1,r-1,need-arr[j].c); path.pop();
        if(over||sols.length>=MAXALT) return;
      }
    };
    dfs(0,k,target);
    left-=nodes;
    return {sols:sols.map(ix=>ix.map(q=>arr[q])),over};
  }
  // Smaller combinations first (k ascending); fixed deterministic choice; lock used items
  for(let k=2;k<=maxK;k++){
    for(const t of targets){
      if(!usedV.has(t.id)){
        const r=search(avail,t.c,k);
        if(r.over) exhausted++;
        if(r.sols.length){
          const [first,...alt]=r.sols;
          const items=first.slice().sort((a,b)=>a.line-b.line);
          items.forEach(x=>usedS.add(x.id)); usedV.add(t.id);
          avail=avail.filter(x=>!usedS.has(x.id));
          matches.push({target:t,items,alt,over:r.over});
        }
      }
      if(prog) prog(++done/steps);
    }
  }
  // Step 13: re-verify every match before it is trusted
  const seenS=new Set(), seenV=new Set();
  for(const m of matches){
    const ids=m.items.map(x=>x.id);
    m.sum=m.items.reduce((a,x)=>a+x.c,0);
    const fresh=ids.every(id=>!seenS.has(id))&&new Set(ids).size===ids.length&&!seenV.has(m.target.id);
    ids.forEach(id=>seenS.add(id)); seenV.add(m.target.id);
    m.verified=fresh&&m.sum===m.target.c&&m.items.length>=2;
  }
  if(prog) prog(1);
  return {identical,matches,exhausted,
    unV:vivaAll.filter(v=>!usedV.has(v.id)),
    unS:softAll.filter(s=>!usedS.has(s.id))};
}
function selfTests(){
  const R=[], ok=(n,c)=>R.push([n,!!c]);
  const mkE=(arr,p)=>arr.map((x,i)=>({id:p+i,line:i+1,c:parseAmount(x).c}));
  const run=(v,s)=>solveCore({viva:mkE(v,'V'),soft:mkE(s,'S'),maxK:8,budget:200000,total:3e7},null);
  const sumM=m=>m.items.reduce((a,x)=>a+x.c,0);
  ok('ανάλυση 9,59',parseAmount('9,59').c===959);
  ok('ανάλυση 1.234,56',parseAmount('1.234,56').c===123456);
  ok('ανάλυση 1,234.5',parseAmount('1,234.5').c===123450);
  ok('ανάλυση -66,86',parseAmount('-66,86').c===-6686);
  ok('απόρριψη 1.234',!parseAmount('1.234').ok);
  let r=run(['22'],['10','11','1']);
  ok('TEST 1',r.matches.length===1&&r.matches[0].items.length===3&&sumM(r.matches[0])===2200&&r.matches[0].verified);
  r=run(['100'],['70','20','10','5']);
  ok('TEST 2',r.matches.length===1&&r.matches[0].items.length===3&&sumM(r.matches[0])===10000&&!r.matches[0].items.some(x=>x.c===500));
  r=run(['50'],['100','-30','-20']);
  ok('TEST 3',r.matches.length===1&&sumM(r.matches[0])===5000);
  r=run(['9,59'],['26,98','18,48','30,99','-66,86']);
  ok('TEST 4',r.matches.length===1&&r.matches[0].items.length===4&&sumM(r.matches[0])===959);
  r=run(['10','20'],['10','20']);
  ok('TEST 5',r.identical.length===2&&r.matches.length===0&&r.unV.length===0&&r.unS.length===0);
  r=run(['20','20'],['10','10','10']);
  ok('TEST 6',r.matches.length===1&&r.unV.length===1&&r.unS.length===1);
  r=run(['5','999'],['1','2']);
  ok('TEST 7',r.matches.length===0&&r.unV.length===2&&r.unS.length===2);
  r=run(['30'],['10','20','10','20']);
  ok('TEST 8',r.matches.length===1&&sumM(r.matches[0])===3000&&r.matches[0].alt.length>=1&&new Set(r.matches[0].items.map(x=>x.id)).size===2);
  return {pass:R.filter(x=>x[1]).length,total:R.length,fail:R.filter(x=>!x[1]).map(x=>x[0])};
}
// ENGINE-END

// ---------- UI ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const expr=(it,t)=>it.map((x,i)=>(i?(x.c<0?' - ':' + '):(x.c<0?'-':''))+fmt(Math.abs(x.c))).join('')+' = '+fmt(t.c)+' €';
const note=t=>{$('msg').textContent=t;$('msg').style.display=t?'block':'none';};
const setP=p=>{$('pb').style.width=(p*100).toFixed(1)+'%';};
const tb=(head,rows)=>`<div class="tw"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows||'<tr><td colspan="9">—</td></tr>'}</table></div>`;
let LAST=null;

function parseColumn(text,side){
  const rows=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    const raw=line.split('\t')[0].trim();
    if(!raw) return;
    const p=parseAmount(raw);
    rows.push({id:side+String(rows.length+1).padStart(4,'0'),side,line:i+1,raw,c:p.ok?p.c:null,ok:p.ok,msg:p.msg||''});
  });
  return rows;
}
function runSolver(payload,onP){
  return new Promise(res=>{
    const fallback=()=>res(solveCore(payload,onP));
    try{
      const src='onmessage=function(e){var r=('+solveCore.toString()+')(e.data,function(p){postMessage({p:p})});postMessage({r:r})};';
      const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
      const w=new Worker(url);
      w.onmessage=e=>{ if('p' in e.data) onP(e.data.p); else { w.terminate(); URL.revokeObjectURL(url); res(e.data.r); } };
      w.onerror=()=>{ w.terminate(); fallback(); };
      w.postMessage(payload);
    }catch(err){ fallback(); }
  });
}
async function run(){
  note('');
  const V=parseColumn($('viva').value,'V'), S=parseColumn($('soft').value,'S');
  $('cv').textContent=V.length; $('cs').textContent=S.length;
  if(!V.length&&!S.length) return note('Δεν υπάρχουν δεδομένα για έλεγχο.');
  const clean=x=>({id:x.id,line:x.line,c:x.c});
  const vv=V.filter(x=>x.ok).map(clean), ss=S.filter(x=>x.ok).map(clean);
  $('go').disabled=true; setP(0); $('out').innerHTML='';
  try{
    const res=await runSolver({viva:vv,soft:ss,maxK:+$('mk').value,budget:200000,total:30000000},setP);
    LAST={V,S,res}; render(); setP(1);
  }catch(e){ note('Σφάλμα κατά τον έλεγχο: '+e.message); }
  finally{ $('go').disabled=false; }
}
function render(){
  const {V,S,res}=LAST;
  const by=new Map([...V,...S].map(x=>[x.id,x]));
  const R=id=>by.get(id);
  const sum=a=>a.reduce((t,x)=>t+x.c,0);
  const invV=V.filter(x=>!x.ok), invS=S.filter(x=>!x.ok);
  const idV=res.identical.map(p=>p.v), idS=res.identical.map(p=>p.s);
  const matchedV=res.matches.map(m=>m.target), usedSItems=res.matches.flatMap(m=>m.items);
  const cV=V.length===idV.length+matchedV.length+res.unV.length+invV.length;
  const cS=S.length===idS.length+usedSItems.length+res.unS.length+invS.length;
  const allVer=res.matches.every(m=>m.verified);
  const final=cV&&cS&&allVer;
  const st=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
  let h=`<p>Κατάσταση: ${final?'<span class="ok">ΕΠΙΒΕΒΑΙΩΜΕΝΟ</span>':'<span class="bad">ΜΗ ΕΠΙΒΕΒΑΙΩΜΕΝΟ</span>'}</p>`;
  h+=`<div class="stats">${st(V.length,'Σύνολο εγγραφών VIVA')}${st(S.length,'Σύνολο εγγραφών SOFTONE')}${st(idV.length,'Ίδια ποσά')}${st(matchedV.length,'Αντιστοιχίσεις από αθροίσματα')}${st(res.unV.length+res.unS.length,'Ποσά που περισσεύουν')}${st(fmt(sum(V.filter(x=>x.ok))),'Αξία VIVA (€)')}${st(fmt(sum(S.filter(x=>x.ok))),'Αξία SOFTONE (€)')}${st(fmt(sum(matchedV)),'Αξία αντιστοιχισμένων VIVA (€)')}</div>`;
  const W=invV.concat(invS).map(x=>`Μη έγκυρη τιμή ${x.side==='V'?'VIVA':'SOFTONE'}, γραμμή ${x.line}: «${esc(x.raw)}» (${x.msg})`);
  if(!cV||!cS) W.push('Ο έλεγχος πληρότητας απέτυχε. Τα αποτελέσματα δεν είναι επιβεβαιωμένα.');
  if(!allVer) W.push('Κάποια αντιστοίχιση δεν πέρασε την επαλήθευση.');
  if(res.exhausted) W.push(`${res.exhausted} αναζητήσεις σταμάτησαν λόγω ορίου υπολογισμών. Μπορεί να υπάρχουν μη εντοπισμένοι συνδυασμοί· μειώστε το μέγιστο πλήθος ποσών.`);
  h+=W.map(w=>`<div class="warn">${w}</div>`).join('');

  h+=`<div class="sec"><h3>ΣΤΗΛΕΣ Α &amp; Β — ΠΟΣΑ VIVA ΠΟΥ ΒΡΕΘΗΚΑΝ ΑΠΟ ΑΘΡΟΙΣΜΑΤΑ SOFTONE</h3>`;
  h+=tb(['Ποσό VIVA','Γραμμές','Αναλυτική πράξη SOFTONE','Έλεγχος'],res.matches.map(m=>{
    const t=m.target, it=m.items;
    const alts=m.alt.map(a=>expr(a.slice().sort((x,y)=>x.line-y.line),t)).join('<br>');
    return `<tr><td class="n">${fmt(t.c)} €</td>
      <td>VIVA ${t.line}<br>SOFTONE ${it.map(x=>x.line).join(', ')}</td>
      <td class="op">${expr(it,t)}${m.alt.length?` <span class="tag">+${m.alt.length} εναλλακτικοί</span>`:''}
      <span class="detb">IDs: ${t.id} | ${it.map(x=>x.id).join(', ')}${alts?`<br>Εναλλακτικοί συνδυασμοί:<br>${alts}`:''}</span></td>
      <td>${m.verified?'<span class="ok">✓</span>':'<span class="bad">✗</span>'}</td></tr>`;
  }).join(''));
  h+=`</div>`;

  h+=`<div class="sec"><h3>ΣΤΗΛΗ Γ — ΙΔΙΑ ΠΟΣΑ ΣΤΙΣ ΔΥΟ ΣΤΗΛΕΣ</h3>`;
  h+=tb(['Γραμμή VIVA','Ποσό VIVA','Γραμμή SOFTONE','Ποσό SOFTONE'],res.identical.map(({v,s})=>
    `<tr><td>${v.line}</td><td class="n">${fmt(v.c)}</td><td>${s.line}</td><td class="n">${fmt(s.c)}</td></tr>`).join(''));
  h+=`</div>`;

  const list=arr=>tb(['Γραμμή','Αρχική τιμή','Ποσό'],arr.map(x=>`<tr><td>${x.line}<span class="det"> (${x.id})</span></td><td>${esc(R(x.id).raw)}</td><td class="n">${fmt(x.c)}</td></tr>`).join(''));
  h+=`<div class="sec"><h3>ΣΤΗΛΗ Δ — ΠΟΣΑ ΠΟΥ ΠΕΡΙΣΣΕΥΟΥΝ</h3>
    <div class="sub">Ποσά SOFTONE που περισσεύουν (${res.unS.length})</div>${list(res.unS)}
    <div class="sub">Ποσά VIVA που περισσεύουν (${res.unV.length})</div>${list(res.unV)}</div>`;
  $('out').innerHTML=h;
}
function exportCSV(){
  if(!LAST) return note('Εκτελέστε πρώτα τον έλεγχο.');
  const {V,S,res}=LAST;
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['ΣΥΝΟΨΗ','Εγγραφές VIVA',V.length,'Εγγραφές SOFTONE',S.length,'Ίδια ποσά',res.identical.length,'Αντιστοιχίσεις',res.matches.length],
    ['Κατηγορία','Γραμμή VIVA','ID VIVA','Ποσό VIVA','Γραμμές SOFTONE','IDs SOFTONE','Ποσά SOFTONE','Αναλυτική πράξη','Επαλήθευση']];
  res.identical.forEach(({v,s})=>rows.push(['ΙΔΙΑ ΠΟΣΑ',v.line,v.id,fmt(v.c),s.line,s.id,fmt(s.c),'Ταυτόσημα','ΝΑΙ']));
  res.matches.forEach(m=>{const it=m.items;rows.push(['ΑΝΤΙΣΤΟΙΧΙΣΗ ΑΠΟ ΑΘΡΟΙΣΜΑ',m.target.line,m.target.id,fmt(m.target.c),it.map(x=>x.line).join('|'),it.map(x=>x.id).join('|'),it.map(x=>fmt(x.c)).join(' | '),expr(it,m.target),m.verified?'ΝΑΙ':'ΟΧΙ']);});
  res.unV.forEach(v=>rows.push(['ΠΕΡΙΣΣΕΥΕΙ VIVA',v.line,v.id,fmt(v.c),'','','','','']));
  res.unS.forEach(s=>rows.push(['ΠΕΡΙΣΣΕΥΕΙ SOFTONE','','','',s.line,s.id,fmt(s.c),'','']));
  V.concat(S).filter(x=>!x.ok).forEach(x=>{const isV=x.side==='V';rows.push(['ΜΗ ΕΓΚΥΡΟ',isV?x.line:'',isV?x.id:'',isV?x.raw:'',isV?'':x.line,isV?'':x.id,isV?'':x.raw,x.msg,'']);});
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='viva_softone_apotelesmata.csv'; a.click();
}

['viva','soft'].forEach(id=>$(id).addEventListener('input',()=>{
  $(id==='viva'?'cv':'cs').textContent=$(id).value.split(/\r?\n/).filter(l=>l.trim()).length;
}));
